[project]
name = "bullet-terminal"
version = "0.1.0"
description = "A terminal life manager built on four bullets: tasks, notes, journals and events in plain Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Khalid Al-Ghamdi" }]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "rich-click>=1.8",
    "questionary>=2.0",
    "python-ulid>=3.0",
    "python-frontmatter>=1.1",
    "tomlkit>=0.13",
    "typing_extensions>=4.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
bt = "bute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_config_paths: test reads the real config constants; skips the isolation fixture",
]
