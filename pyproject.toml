[project]
name = "bute"
version = "0.1.0"
description = "AI-powered CLI life management system based on the Bullet Journal methodology"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Khalid Al-Ghamdi" }]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "rich-click>=1.8",
    "questionary>=2.0",
    "python-ulid>=3.0",
    "python-frontmatter>=1.1",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.4",
    "sqlite-vec>=0.1",
]
ai = [
    "openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
bute = "bute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
